<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 01</title>
<style>
  :root { --paper:#f5f5f9; --ink:#1d1d22; --grid:rgba(110,130,210,0.35); }
  html,body{margin:0;height:100%;background:#2a2a30;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Segoe Print",cursive;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:var(--paper);image-rendering:auto;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100vw;max-height:100vh;aspect-ratio:16/9;}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:12px;pointer-events:none;}
  #touch button{pointer-events:auto;width:70px;height:70px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.15);color:#fff;font-size:28px;margin:6px;}
  @media (pointer:coarse){#touch{display:flex;}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
  <div><button data-k="Space">⤒</button></div>
</div>
<script>
'use strict';
// ------------------------------------------------------------------
//  LEVEL 01 - a pencil-on-graph-paper platformer.
//  Every object below is placed with the coordinates of the original
//  sketch (image pixels), so the layout is a 1:1 copy of the drawing.
// ------------------------------------------------------------------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,GRID=33;
const WORLD={x0:380,y0:380,x1:2000,y1:1310};
const START={x:410,y:1170};

// Solid geometry. dark = pencil-shaded block in the sketch. oneway = thin line (drop/jump through from below).
const SOLIDS=[
  // ---------- bottom floor ----------
  {x:380,y:1215,w:390,h:100},                      // floor left of the spike pit (Start)
  {x:760,y:1290,w:420,h:30},                       // pit floor (under the spikes)
  {x:995,y:1150,w:65,h:160},                       // tall pillar in the pit
  {x:1180,y:1215,w:820,h:100},                     // floor right of the pit
  {x:1150,y:1195,w:75,h:10,dark:true,oneway:true}, // small floating ledge
  {x:1060,y:1085,w:80,h:8,oneway:true},            // thin platform above the pillar
  {x:965,y:1025,w:50,h:10,oneway:true},            // tree platform (center)
  // ---------- right side climb ----------
  {x:1370,y:1025,w:90,h:8,oneway:true},            // thin platform before the ramp
  {x:1740,y:975,w:110,h:10,oneway:true},           // enemy platform after the ramp
  {x:1850,y:820,w:150,h:50,dark:true},             // big L block (horizontal)
  {x:1950,y:720,w:35,h:100,dark:true},             // big L block (pole)
  // ---------- middle floor ----------
  {x:1000,y:815,w:300,h:10,oneway:true},           // middle floor
  {x:1095,y:770,w:26,h:45,crate:true},             // crate 1
  {x:1195,y:770,w:26,h:45,crate:true},             // crate 2
  {x:1340,y:820,w:120,h:50,dark:true},             // descending block 1
  {x:1480,y:815,w:80,h:30,dark:true},              // descending block 2
  {x:1610,y:840,w:90,h:30,dark:true},              // descending block 3
  {x:660,y:800,w:240,h:10},                        // lid of the spike mouth
  {x:660,y:880,w:210,h:8},                         // bottom of the spike mouth
  {x:585,y:780,w:50,h:14,dark:true},               // small dark ledge
  {x:520,y:750,w:60,h:8},                          // step 2
  {x:470,y:725,w:52,h:8},                          // step 1
  {x:380,y:720,w:95,h:8},                          // door floor
  {x:380,y:585,w:12,h:140},                        // wall left of the door
  // ---------- upper floor ----------
  {x:550,y:650,w:150,h:12},                        // small upper platform (spikes + enemy)
  {x:700,y:615,w:790,h:25},                        // main upper floor
  {x:1500,y:655,w:100,h:25,dark:true,oneway:true}, // upper-right ledge (jump through from below)
];
// Slopes: walkable surface lines (x1,y1)->(x2,y2) plus a shaded body polygon.
const SLOPES=[
  {x1:1490,y1:1030,x2:1740,y2:985,poly:[[1490,1030],[1740,985],[1740,1000],[1490,1050]],dark:true},  // ramp
  {x1:1305,y1:615,x2:1360,y2:430,poly:[[1305,615],[1360,430],[1420,615]],mountain:true},           // big peak (left face)
  {x1:1360,y1:430,x2:1420,y2:615},                                                                  // big peak (right face)
];
// Hazards. kind: up (spikes pointing up), down (hanging spikes), mouth (teeth top & bottom).
const HAZARDS=[
  {x:760,y:1245,w:235,h:45,kind:'up'},   // pit spikes left of pillar
  {x:1060,y:1245,w:120,h:45,kind:'up'},  // pit spikes right of pillar
  {x:780,y:575,w:300,h:40,kind:'up'},    // upper spike field
  {x:880,y:640,w:120,h:30,kind:'down'},  // spikes hanging under the upper floor
  {x:600,y:636,w:80,h:14,kind:'up'},     // small spikes on the small upper platform
  {x:660,y:810,w:210,h:70,kind:'mouth'}, // the spike mouth
];
const ENEMIES=[
  {x:585,y:628,minX:552,maxX:598,speed:35},
  {x:1120,y:593,minX:1090,maxX:1290,speed:60},
  {x:1670,y:818,minX:1612,maxX:1698,speed:50},
  {x:1800,y:953,minX:1742,maxX:1848,speed:60},
  {x:900,y:1195,hover:true,baseY:1195,amp:28,speed:1.6},
];
const MOVER={x:760,y:505,w:110,h:35,minX:760,maxX:1050,speed:85,dir:1};
const COINS=[{x:1245,y:575}];
const GOAL={x:395,y:585,w:75,h:135};
const TREES=[[710,615],[1180,615],[990,1025],[1370,1215]];
const MOUNTAINS=[[1430,1215,60,80],[1470,1215,70,120],[1520,1215,50,90]];
const SIGN={cx:1025,cy:455,w:170,h:90,rot:-0.32};
const CLOUDS=[[470,650,70],[620,790,55],[740,760,60],[930,790,65],[1140,560,50],[1330,470,90],[1550,730,70],[1720,700,60],[1470,880,60],[1690,960,60],[820,1170,70],[1090,1140,65],[1200,1140,60],[1400,1130,70],[1600,1110,60],[840,470,70],[720,540,60],[1030,850,60],[1230,720,55],[1860,1010,50],[1120,980,70]];

// ------------------------------------------------------------------
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault(); onKey(e.code);});
addEventListener('keyup',e=>{keys[e.code]=false;});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;onKey(k);});
  b.addEventListener('pointerup',()=>keys[k]=false);
  b.addEventListener('pointercancel',()=>keys[k]=false);
});
let state='menu', menuIndex=0, showControls=false;
const MENU=['Start Level 01','Controls','Credits'];
let jumpBuffer=0;
function onKey(code){
  if(state==='menu'){
    if(showControls){ if(code==='Escape'||code==='Enter'||code==='Space')showControls=false; return; }
    if(code==='ArrowDown'||code==='KeyS')menuIndex=(menuIndex+1)%MENU.length;
    if(code==='ArrowUp'||code==='KeyW')menuIndex=(menuIndex+MENU.length-1)%MENU.length;
    if(code==='Enter'||code==='Space')selectMenu(menuIndex);
  }else if(state==='play'){
    if(code==='Escape')state='pause';
    if(code==='Space'||code==='ArrowUp'||code==='KeyW')jumpBuffer=0.12;
    if(code==='KeyR')resetLevel();
  }else if(state==='pause'){
    if(code==='Escape'||code==='Enter'||code==='Space')state='play';
    if(code==='KeyM')state='menu';
    if(code==='KeyR'){resetLevel();state='play';}
  }else if(state==='dead'){
  }else if(state==='won'){
    if(code==='Enter'||code==='Space'){state='menu';}
    if(code==='KeyR'){resetLevel();state='play';}
  }
}
function selectMenu(i){
  if(i===0){resetLevel();state='play';}
  else if(i===1)showControls='controls';
  else showControls='credits';
}
// mouse / tap on menu
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*W/r.width, my=(e.clientY-r.top)*H/r.height;
  if(state==='menu'){
    if(showControls){showControls=false;return;}
    MENU.forEach((m,i)=>{ if(my>250+i*58-24&&my<250+i*58+24&&mx>W/2-160&&mx<W/2+160){menuIndex=i;selectMenu(i);} });
  }else if(state==='won'){state='menu';}
  else if(state==='pause'){state='play';}
});

// ------------------------------------------------------------------
const P={x:0,y:0,w:26,h:40,vx:0,vy:0,onGround:false,coyote:0,face:1,onMover:false};
let coins=0,deaths=0,time=0,deadTimer=0,coinsTaken=[],cam={x:0,y:0},finalTime=0;
function resetLevel(){
  P.x=START.x;P.y=START.y;P.vx=0;P.vy=0;P.onGround=false;P.face=1;
  coins=0;deaths=0;time=0;coinsTaken=COINS.map(()=>false);
  MOVER.x=MOVER.minX;MOVER.dir=1;
  ENEMIES.forEach(e=>{e.dir=1;if(!e.hover)e.x=(e.minX+e.maxX)/2;});
  cam.x=P.x-W/2;cam.y=P.y-H/2;
}
function respawn(){P.x=START.x;P.y=START.y;P.vx=0;P.vy=0;}
const GRAV=2000,JUMP=910,SPEED=300,ACC=2600,FRICTION=2200;
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function updatePlay(dt){
  time+=dt;
  // moving platform
  const prevMx=MOVER.x;
  MOVER.x+=MOVER.speed*MOVER.dir*dt;
  if(MOVER.x>MOVER.maxX){MOVER.x=MOVER.maxX;MOVER.dir=-1;}
  if(MOVER.x<MOVER.minX){MOVER.x=MOVER.minX;MOVER.dir=1;}
  if(P.onMover)P.x+=MOVER.x-prevMx;
  // enemies
  for(const e of ENEMIES){
    if(e.hover){e.y=e.baseY+Math.sin(time*e.speed)*e.amp;continue;}
    e.x+=e.speed*e.dir*dt;
    if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;} if(e.x<e.minX){e.x=e.minX;e.dir=1;}
  }
  // input
  const left=keys.ArrowLeft||keys.KeyA, right=keys.ArrowRight||keys.KeyD;
  const holdJump=keys.Space||keys.ArrowUp||keys.KeyW;
  if(left){P.vx-=ACC*dt;P.face=-1;} else if(right){P.vx+=ACC*dt;P.face=1;}
  else{ if(P.vx>0)P.vx=Math.max(0,P.vx-FRICTION*dt); else P.vx=Math.min(0,P.vx+FRICTION*dt); }
  P.vx=Math.max(-SPEED,Math.min(SPEED,P.vx));
  jumpBuffer-=dt; P.coyote-=dt;
  if(jumpBuffer>0&&(P.onGround||P.coyote>0)){P.vy=-JUMP;P.onGround=false;P.coyote=0;jumpBuffer=0;}
  if(!holdJump&&P.vy<-250)P.vy=-250; // variable jump height
  P.vy+=GRAV*dt; if(P.vy>1400)P.vy=1400;
  const wasGround=P.onGround; P.onGround=false; P.onMover=false;
  const prevBottom=P.y+P.h;
  // horizontal
  P.x+=P.vx*dt;
  for(const s of SOLIDS){ if(s.oneway)continue; if(overlap(P,s)){ if(P.vx>0)P.x=s.x-P.w; else if(P.vx<0)P.x=s.x+s.w; P.vx=0; } }
  if(P.x<WORLD.x0)P.x=WORLD.x0; if(P.x+P.w>WORLD.x1)P.x=WORLD.x1-P.w;
  // vertical
  P.y+=P.vy*dt;
  const allSolids=SOLIDS.concat([MOVER]);
  for(const s of allSolids){
    if(!overlap(P,s))continue;
    if(s.oneway){ if(P.vy>=0&&prevBottom<=s.y+1){P.y=s.y-P.h;P.vy=0;P.onGround=true;} continue; }
    if(P.vy>0&&prevBottom<=s.y+1){P.y=s.y-P.h;P.vy=0;P.onGround=true; if(s===MOVER)P.onMover=true;}
    else if(P.vy<0){P.y=s.y+s.h;P.vy=0;}
    else if(P.vy>0){P.y=s.y-P.h;P.vy=0;P.onGround=true;}
  }
  // slopes
  const cx=P.x+P.w/2;
  for(const s of SLOPES){
    if(cx<s.x1||cx>s.x2)continue;
    const t=(cx-s.x1)/(s.x2-s.x1), sy=s.y1+(s.y2-s.y1)*t, bottom=P.y+P.h;
    if(P.vy>=0&&bottom>=sy-4&&bottom<=sy+34){P.y=sy-P.h;P.vy=0;P.onGround=true;}
  }
  if(wasGround&&!P.onGround)P.coyote=0.1;
  // hazards / enemies / fall
  const hit={x:P.x+5,y:P.y+4,w:P.w-10,h:P.h-6};
  let die=false;
  for(const h of HAZARDS){ const inner=h.kind==='mouth'?{x:h.x,y:h.y+8,w:h.w,h:h.h-16}:{x:h.x,y:h.y+10,w:h.w,h:h.h-10}; if(h.kind==='down')inner.y=h.y; if(overlap(hit,inner))die=true; }
  for(const e of ENEMIES){ if(overlap(hit,{x:e.x-13,y:e.y+2,w:26,h:20}))die=true; }
  if(P.y>WORLD.y1)die=true;
  if(die){deaths++;state='dead';deadTimer=0.7;return;}
  // coins
  COINS.forEach((c,i)=>{ if(!coinsTaken[i]&&overlap(hit,{x:c.x-16,y:c.y-16,w:32,h:32})){coinsTaken[i]=true;coins++;} });
  // goal
  if(overlap(hit,GOAL)){state='won';finalTime=time;}
}

// ------------------------------------------------------------------ drawing
function ink(lw){ctx.strokeStyle='#1d1d22';ctx.lineWidth=lw||3;ctx.lineJoin='round';ctx.lineCap='round';}
function paper(){ ctx.fillStyle='#f5f5f9';ctx.fillRect(0,0,W,H); }
function grid(ox,oy){
  ctx.strokeStyle='rgba(110,130,210,0.30)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=-((ox)%GRID);x<W;x+=GRID){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=-((oy)%GRID);y<H;y+=GRID){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
}
function cloud(x,y,r){
  const bumps=[[0,0,r],[-r*0.9,r*0.25,r*0.65],[r*0.9,r*0.2,r*0.7],[-r*0.45,-r*0.35,r*0.6],[r*0.4,-r*0.4,r*0.6]];
  ctx.strokeStyle='rgba(60,60,70,0.55)';ctx.lineWidth=1.6;ctx.beginPath();
  for(const [dx,dy,rr] of bumps){ctx.moveTo(x+dx+rr,y+dy);ctx.arc(x+dx,y+dy,rr,0,Math.PI*2);}
  ctx.stroke();
  ctx.fillStyle='#f5f5f9';ctx.beginPath();
  for(const [dx,dy,rr] of bumps){ctx.moveTo(x+dx+rr-1.2,y+dy);ctx.arc(x+dx,y+dy,rr-1.2,0,Math.PI*2);}
  ctx.fill();
}
function tree(x,y){ // x = center, y = ground
  ink(2.5);ctx.fillStyle='#f5f5f9';
  ctx.strokeRect(x-9,y-18,18,18);
  const layers=[[y-18,34],[y-34,28],[y-48,22]];
  for(const [by,w] of layers){ctx.beginPath();ctx.moveTo(x-w/2,by);ctx.lineTo(x,by-26);ctx.lineTo(x+w/2,by);ctx.closePath();ctx.fillStyle='#2b2b30';ctx.fill();ctx.stroke();}
}
function spikes(h){
  ink(2.5);const n=Math.max(1,Math.round(h.w/30)),sw=h.w/n;ctx.fillStyle='#f5f5f9';
  if(h.kind==='up'||h.kind==='down'){
    for(let i=0;i<n;i++){const x=h.x+i*sw;ctx.beginPath();
      if(h.kind==='up'){ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+sw/2,h.y);ctx.lineTo(x+sw,h.y+h.h);} else {ctx.moveTo(x,h.y);ctx.lineTo(x+sw/2,h.y+h.h);ctx.lineTo(x+sw,h.y);}
      ctx.closePath();ctx.fillStyle=i%2?'#f5f5f9':'#3a3a40';ctx.fill();ctx.stroke();}
  } else { // mouth: teeth from top and bottom
    const th=h.h*0.55;
    for(let i=0;i<n;i++){const x=h.x+i*sw;
      ctx.beginPath();ctx.moveTo(x,h.y);ctx.lineTo(x+sw/2,h.y+th);ctx.lineTo(x+sw,h.y);ctx.closePath();ctx.fillStyle='#f5f5f9';ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+sw/2,h.y+h.h);ctx.lineTo(x+sw,h.y+h.h-th);ctx.lineTo(x+sw+sw/2,h.y+h.h);ctx.closePath();ctx.fillStyle='#2b2b30';ctx.fill();ctx.stroke();}
  }
}
function enemy(e){
  ink(2.5);ctx.fillStyle='#f5f5f9';
  ctx.beginPath();ctx.arc(e.x,e.y+22,14,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();for(let a=-70;a<=70;a+=35){const r=a*Math.PI/180;ctx.moveTo(e.x+Math.sin(r)*14,e.y+22-Math.cos(r)*14);ctx.lineTo(e.x+Math.sin(r)*21,e.y+22-Math.cos(r)*21);}ctx.stroke();
  ctx.fillStyle='#1d1d22';ctx.beginPath();ctx.arc(e.x-4,e.y+16,1.8,0,7);ctx.arc(e.x+4,e.y+16,1.8,0,7);ctx.fill();
}
function coin(c,t){
  ink(2.5);const s=1+Math.sin(t*4)*0.08;ctx.save();ctx.translate(c.x,c.y);ctx.scale(s,1);
  ctx.fillStyle='#f5f5f9';ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();ctx.restore();
}
function door(){
  ink(4);ctx.fillStyle='#f5f5f9';ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
  ink(2.5);const cx=GOAL.x+GOAL.w/2,cy=GOAL.y+GOAL.h*0.55,r=30;
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI/2,-Math.PI/2);ctx.closePath();ctx.stroke();
  ctx.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/5;ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.stroke();
}
function sign(){
  ctx.save();ctx.translate(SIGN.cx,SIGN.cy);ctx.rotate(SIGN.rot);ink(3);ctx.fillStyle='#f5f5f9';
  ctx.fillRect(-SIGN.w/2,-SIGN.h/2,SIGN.w,SIGN.h);ctx.strokeRect(-SIGN.w/2,-SIGN.h/2,SIGN.w,SIGN.h);
  ctx.fillStyle='#1d1d22';for(const [sx,sy] of [[-1,-1],[1,-1],[1,1]]){ctx.beginPath();ctx.arc(sx*SIGN.w/2,sy*SIGN.h/2,6,0,7);ctx.fill();}
  ctx.beginPath();ctx.moveTo(-50,-20);ctx.lineTo(20,20);ctx.lineTo(28,4);ctx.lineTo(40,36);ctx.lineTo(4,32);ctx.lineTo(14,26);ctx.lineTo(-56,-12);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function player(){
  ink(2.5);ctx.fillStyle='#f5f5f9';ctx.fillRect(P.x,P.y,P.w,P.h);ctx.strokeRect(P.x,P.y,P.w,P.h);
  ctx.fillStyle='#1d1d22';const ex=P.x+P.w/2+P.face*5;ctx.beginPath();ctx.arc(ex-4,P.y+12,2,0,7);ctx.arc(ex+4,P.y+12,2,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(ex-5,P.y+22);ctx.quadraticCurveTo(ex,P.y+27,ex+5,P.y+22);ctx.stroke();
  ctx.fillRect(P.x+4,P.y+P.h-6,7,6);ctx.fillRect(P.x+P.w-11,P.y+P.h-6,7,6);
}
function hand(text,x,y,size,align){ctx.fillStyle='#3a3a44';ctx.font=(size||22)+'px "Comic Sans MS","Chalkboard SE","Segoe Print",cursive';ctx.textAlign=align||'left';ctx.fillText(text,x,y);}
function arrow(x1,y1,x2,y2){ink(2);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);const a=Math.atan2(y2-y1,x2-x1);ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a-0.5),y2-12*Math.sin(a-0.5));ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a+0.5),y2-12*Math.sin(a+0.5));ctx.stroke();}

function drawWorld(t){
  // camera
  const tx=P.x+P.w/2-W/2, ty=P.y+P.h/2-H/2;
  cam.x+=(tx-cam.x)*0.12; cam.y+=(ty-cam.y)*0.12;
  cam.x=Math.max(WORLD.x0,Math.min(WORLD.x1-W,cam.x)); cam.y=Math.max(WORLD.y0,Math.min(WORLD.y1-H,cam.y));
  const ox=Math.round(cam.x),oy=Math.round(cam.y);
  paper(); grid(ox,oy);
  ctx.save();ctx.translate(-ox,-oy);
  // background ("Hintergrund")
  for(const [x,y,r] of CLOUDS)cloud(x,y,r);
  ink(2.5);for(const [x,y,w,h] of MOUNTAINS){ctx.fillStyle='#f5f5f9';ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x,y-h);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x-8,y-h+18);ctx.lineTo(x+2,y-h+30);ctx.lineTo(x-6,y-h+42);ctx.stroke();}
  sign();
  hand('Level 01',400,420,24);
  hand('Hintergrund',1120,410,20); arrow(1110,412,1075,470);
  hand('Start',420,1130,22); arrow(430,1140,430,1190);
  for(const [x,y] of TREES)tree(x,y);
  // solids
  for(const s of SOLIDS){
    ink(s.oneway?4:3);ctx.fillStyle=s.dark?'#2b2b30':'#f5f5f9';
    if(s.crate){ctx.fillStyle='#2b2b30';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.strokeRect(s.x,s.y,s.w,s.h);ctx.fillStyle='#f5f5f9';ctx.fillRect(s.x+8,s.y+8,10,4);ctx.fillRect(s.x+8,s.y+20,10,4);ctx.fillRect(s.x+8,s.y+32,10,4);continue;}
    ctx.fillRect(s.x,s.y,s.w,s.h);ctx.strokeRect(s.x,s.y,s.w,s.h);
  }
  for(const s of SLOPES){ if(!s.poly)continue; ink(3);ctx.fillStyle=s.dark?'#2b2b30':'#f5f5f9';ctx.beginPath();s.poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();
    if(s.mountain){ctx.fillStyle='#2b2b30';ctx.beginPath();ctx.moveTo(1305,615);ctx.lineTo(1360,430);ctx.lineTo(1372,615);ctx.closePath();ctx.fill();} }
  // moving platform
  ink(3);ctx.fillStyle='#2b2b30';ctx.fillRect(MOVER.x,MOVER.y,MOVER.w,MOVER.h);ctx.strokeRect(MOVER.x,MOVER.y,MOVER.w,MOVER.h);
  for(const h of HAZARDS)spikes(h);
  door();
  COINS.forEach((c,i)=>{if(!coinsTaken[i])coin(c,t);});
  for(const e of ENEMIES)enemy(e);
  if(state!=='dead')player();
  ctx.restore();
  // HUD
  hand('Coins '+coins+'/'+COINS.length,W-20,36,24,'right');
  hand('Time '+time.toFixed(1)+'s',W-20,64,18,'right');
  hand('Deaths '+deaths,W-20,88,18,'right');
  hand('Esc = Pause',20,H-16,16);
}
function overlayBox(title,lines){
  ctx.fillStyle='rgba(245,245,249,0.85)';ctx.fillRect(0,0,W,H);
  ink(3);ctx.fillStyle='#f5f5f9';ctx.fillRect(W/2-260,110,520,H-220);ctx.strokeRect(W/2-260,110,520,H-220);
  hand(title,W/2,170,40,'center');
  lines.forEach((l,i)=>hand(l,W/2,225+i*32,20,'center'));
}
function drawMenu(t){
  paper();grid(0,0);
  for(const [x,y,r] of [[130,120,60],[820,90,70],[880,430,55],[110,440,60],[500,470,50]])cloud(x,y,r);
  hand('LEVEL 01',W/2,120,64,'center');
  hand('a pencil & paper platformer',W/2,160,22,'center');
  if(showControls){
    const c=showControls==='controls'
      ?['Move: Arrow keys or A / D','Jump: Space, W or Up (hold for higher)','Pause: Esc     Restart: R','Collect the coin, avoid spikes and','the spiky critters, reach the door.','','Press Enter or click to go back']
      :['Level design: the hand-drawn sketch','(Level 01, Hintergrund, Coins 01, Start)','Built as a 1:1 copy of the paper layout','on graph paper, with pencil ink.','','Press Enter or click to go back'];
    overlayBox(showControls==='controls'?'Controls':'Credits',c);return;
  }
  MENU.forEach((m,i)=>{
    const y=250+i*58,sel=i===menuIndex;
    ink(sel?4:2.5);ctx.fillStyle=sel?'#2b2b30':'#f5f5f9';ctx.fillRect(W/2-160,y-24,320,48);ctx.strokeRect(W/2-160,y-24,320,48);
    ctx.fillStyle=sel?'#f5f5f9':'#3a3a44';ctx.font='24px "Comic Sans MS","Chalkboard SE","Segoe Print",cursive';ctx.textAlign='center';ctx.fillText(m,W/2,y+9);
  });
  hand('Up/Down + Enter, or click',W/2,470,16,'center');
  // little preview of the hero and an enemy
  P.x=W/2+220;P.y=250;P.face=-1;player();enemy({x:W/2-230,y:250});
}
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;const t=now/1000;
  if(state==='menu')drawMenu(t);
  else{
    if(state==='play')updatePlay(dt);
    if(state==='dead'){deadTimer-=dt;if(deadTimer<=0){respawn();state='play';}}
    drawWorld(t);
    if(state==='dead'){ctx.fillStyle='rgba(30,30,40,'+Math.min(0.6,(0.7-deadTimer)*1.5)+')';ctx.fillRect(0,0,W,H);hand('Ouch!',W/2,H/2,48,'center');}
    if(state==='pause')overlayBox('Paused',['Esc / Enter: continue','R: restart level','M: back to menu']);
    if(state==='won')overlayBox('Level 01 complete!',['Coins: '+coins+'/'+COINS.length,'Time: '+finalTime.toFixed(1)+' s','Deaths: '+deaths,'','Enter: menu     R: play again']);
  }
  requestAnimationFrame(frame);
}
resetLevel();
requestAnimationFrame(frame);
</script>

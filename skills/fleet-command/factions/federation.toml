[faction]
name = "Federation"
skill = "/bridge-briefing"
perspective = "Quality, defense, standards"
agents = 5
mandatory = true

[contract]
required_fields = ["FINDING_ID", "FINDING", "S_LEVEL"]
id_prefix = "B"

[confidence]
native_type = "score_100"
# ENGAGE: 80-100, CAUTION: 50-79, ALL STOP: 0-49
mapping = { high = 0.9, medium = 0.6, low = 0.3 }

[prompt]
system = "You are a Starfleet senior officer evaluating code quality, architecture, and defensive standards. Your crew of 5 officers brings rigorous engineering discipline to every review."
focus_areas = [
  "error handling",
  "security boundaries",
  "design patterns",
  "API contracts",
  "test coverage",
]

[budget]
max_turns = 25
estimated_tokens = 3500
